<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popcorn Bucket Login</title>
    <link rel="stylesheet" href = "Popcorn_Bucket_Login.css">
    <link rel="stylesheet" href="style.css">
    <script src="Popcorn_Bucket_Login.js" defer></script>
</head>
<body>
    <button class = "startup" onclick = "document.getElementById('id1').style.display='block'" style="width:auto;">Login</button>
    <div id = "id1" class = "model">
        <div class = "info">
            <span onclick="document.getElementById('id1').style.display='none'" class="close" title="Close Modal">&times;</span>
            <h2>Popcorn Bucket</h2>
            <label for="uname"><b>Username</b></label>
            <input type = "text" placeholder="Username" name = "uname" required>

            <label for="upass"><b>Password</b></label>
            <input type = "password" placeholder="Password" name = "upass" required>
            
            <button type = "submit">Login</button>
        </div>

    </div>
    
</body>
