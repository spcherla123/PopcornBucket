<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results</title>
    <link rel="stylesheet" href="../CSS/search-results-style.css">
    <link rel="stylesheet" href="../CSS/common-elements-style.css">

</head>

<body>
     <div id="header"></div>

    <!-- Container that holds the search bar strip (the white background behind the -->
    <!-- the actual seach bar). -->
    <div id="search-container-strip">  
        <!-- The actual search bar -->
        <div class="search-container">
            <input type="text" id="movieSearch" placeholder="Search movies..." onkeydown="searchMovies(event)">
        </div> 
    </div> 

    <div id="page-body">
        <div class="sidebar">
            <div class="sidebar-header"> Search Results </div>
            <div class="sidebar-element-container"> 
                <button id="sidebar-element-TVShow" class="sidebar-element"> 
                    <span id="sidebar-element-TVShow-name" class="sidebar-element-name"> TV Shows </span>
                    <span id="sidebar-element-TVShow-count" class="sidebar-element-count"> 1000 </span>
                </button>

                <button id="sidebar-element-Movie" class="sidebar-element"> 
                    <span id="sidebar-element-Movie-name" class="sidebar-element-name"> Movies </span>
                    <span id="sidebar-element-Movie-count" class="sidebar-element-count"> 568 </span>
                </button>

                <button id="sidebar-element-People" class="sidebar-element"> 
                    <span id="sidebar-element-People-name" class="sidebar-element-name"> People </span>
                    <span id="sidebar-element-People-count" class="sidebar-element-count"> 128 </span>
                </button>
            </div>

        </div>

        <div class="results-container">
            <div id="search-results-grid" class="movie-grid"></div>
        </div>
    </div>
    <div id="footer"></div>

    <script src="../JavaScript/search-results-page.js", type="module"></script>

    <script>
   

        // for footer
        fetch('footer.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('footer').innerHTML = data;
        });
    </script>




</body>
</html>
