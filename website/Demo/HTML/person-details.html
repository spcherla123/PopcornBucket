<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Movie Details</title>
  <link rel="stylesheet" href="../CSS/main.css">
</head>
<body>
  <div id="details-container">

    <!-- 1) Button to return to main page -->
    <a href="main.html" id="person-back-to-page-button" class="back-to-page-button">← Back to Demo Home</a>
    
       <!-- 2) Backround banner that is filled by JavaScript -->
    <div id="person-details-banner-container">
      <img id="person-details-blur-backdrop-banner" src="" alt="Person Blur Backdrop">
      <img id="person-details-backdrop-banner" src="" alt="Person Backdrop">
    </div>

    <!-- 3) Movie title that is filled by JavaScript -->
    <!--<div class="details-title-container"> -->
        <div id="details-known-for">Loading...</div>
        <h1 id="details-title">Loading...</h1>
        <div id="details-aka-container">Also Known As: </div>
   <!-- </div>-->

    <p id="details-tagline"></p>
    
    <!-- 4) Movie overview that is filled by JavaScript -->
    <h3>Biography</h3>
    <p id="details-biography"></p>

    <!-- 5) Release date + Rating + RUntime that is filled by JavaScript -->
    <div id="details-date-rating-runtime-grid">
      <p><strong id="details-date-label">Release Date:</strong> <span id="details-date"></span></p>
      <p><strong id="details-place-of-birth-label">Place-Of-Birth:</strong> <span id="details-place-of-birth"></span></p>
      <p><strong id="details-death-label">Runtime:</strong> <span id="details-death"></span></p>
      <p><strong id="details-gender-label">Rating:</strong> <span id="details-gender"></span></p>
    </div>





<script src="../JavaScript/person-details.js", type="module"></script>
</body>
</html>
