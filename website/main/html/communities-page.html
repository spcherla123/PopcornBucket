<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>Communities / Groups</title>

    <link rel="stylesheet" href="../css/communities-page-style.css">
     
</head>
<body>
    <div id="sidebar">
        <h3>Communities</h3>
        <div id="group-list"></div>
    </div>

    <div id="feed-container">
        <h2 id="current-group-title">Select a Community</h2>

        <div id="post-form-container" style="display: none;">
            <div class="form-group">
                <textarea id="post-content" placeholder="Share your thoughts in this community"></textarea>
            </div>
            <button onclick="createNewPost()">Post to Community</button>
        </div>

        <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;" />

        <div id="posts-feed"></div>
    </div>


    <script src="../js/communities-page.js"></script>


</body>
</html>
