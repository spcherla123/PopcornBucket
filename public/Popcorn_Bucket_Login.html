<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Popcorn Bucket</title>

    <link rel="stylesheet" href="Popcorn_Bucket_Login.css">
    <script src="Popcorn_Bucket_Login.js" defer></script>
</head>
<body>

    <!-- Main page buttons -->
    <div class="welcome">
        <button class="startup" type="button" data-open="loginModal">
            Login
        </button>

        <button class="startup secondary" type="button" data-open="registerModal">
            Register
        </button>
    </div>

    <!-- login modal -->
    <div id="loginModal" class="modal" role="dialog"
         aria-modal="true" aria-labelledby="loginTitle" hidden>

        <div class="info">

            <button class="close" type="button"
                    data-close="loginModal" aria-label="Close">&times;</button>

            <h2 id="loginTitle">Popcorn Bucket</h2>
            <h3>Login</h3>

            <form id="loginForm">

                <label for="loginUsername">Username</label>
                <input
                    type="text"
                    id="loginUsername"
                    name="username"
                    placeholder="Enter username"
                    autocomplete="username"
                    required
                >

                <label for="loginPassword">Password</label>
                <input
                    type="password"
                    id="loginPassword"
                    name="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                >

                <p id="loginMessage" class="form-message"
                   role="status" aria-live="polite"></p>

                <button type="submit" class="submit-button">
                    Login
                </button>

            </form>

            <p class="switch">
                Don't have an account?
                <button type="button" class="text-button"
                        data-switch="registerModal">
                    Register
                </button>
            </p>

        </div>
    </div>

    <!-- reg modal -->
    <div id="registerModal" class="modal" role="dialog"
         aria-modal="true" aria-labelledby="registerTitle" hidden>

        <div class="info">

            <button class="close" type="button"
                    data-close="registerModal" aria-label="Close">&times;</button>

            <h2 id="registerTitle">Popcorn Bucket</h2>
            <h3>Create New Account</h3>

            <form id="registerForm">

                <label for="registerUsername">Username</label>
                <input
                    type="text"
                    id="registerUsername"
                    name="username"
                    placeholder="Choose a username"
                    minlength="3"
                    maxlength="30"
                    autocomplete="username"
                    required
                >

                <label for="registerEmail">Email Address</label>
                <input
                    type="email"
                    id="registerEmail"
                    name="email"
                    placeholder="Enter email"
                    autocomplete="email"
                    required
                >

                <label for="registerPassword">Password</label>
                <input
                    type="password"
                    id="registerPassword"
                    name="password"
                    placeholder="At least 8 characters"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

                <p id="registerMessage" class="form-message"
                   role="status" aria-live="polite"></p>

                <button type="submit" class="submit-button">
                    Create Account
                </button>

            </form>

            <p class="switch">
                Already have an account?
                <button type="button" class="text-button"
                        data-switch="loginModal">
                    Login
                </button>
            </p>

        </div>
    </div>

</body>
</html>
